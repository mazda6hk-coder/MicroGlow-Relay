services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-microglow_telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-telemetry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  migrate:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-microglow_telemetry}
      PGUSER: ${POSTGRES_USER:-telemetry}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./migrations:/migrations:ro
    command: ["sh", "-c", "for migration in /migrations/*.sql; do psql --set ON_ERROR_STOP=1 --file \"$$migration\"; done"]
    networks: [backend]

  telemetry-api:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: &service-environment
      DATABASE_URL: postgresql://${POSTGRES_USER:-telemetry}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-microglow_telemetry}
      INSTALLATION_HMAC_SECRET: ${INSTALLATION_HMAC_SECRET:?set INSTALLATION_HMAC_SECRET in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      CONSENT_VERSION_V1: ${CONSENT_VERSION_V1:-2026-09}
      CONSENT_VERSION_V2: ${CONSENT_VERSION_V2:-v2.2026-09}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1048576}
      MAX_AGGREGATED_ROWS: ${MAX_AGGREGATED_ROWS:-500}
      PUBLIC_RATE_LIMIT_PER_MINUTE: ${PUBLIC_RATE_LIMIT_PER_MINUTE:-60}
      ADMIN_RATE_LIMIT_PER_MINUTE: ${ADMIN_RATE_LIMIT_PER_MINUTE:-30}
      GEOIP_DATABASE_PATH: /geoip/dbip-country-lite.mmdb
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.30.0.0/24}
    command: ["uvicorn", "app.main:public_app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--no-proxy-headers"]
    volumes:
      - ./data/geoip:/geoip:ro
    expose: ["8000"]
    networks: [backend]

  telemetry-admin:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *service-environment
    command: ["uvicorn", "app.main:admin_app", "--host", "0.0.0.0", "--port", "8001", "--no-access-log", "--no-proxy-headers"]
    expose: ["8001"]
    networks: [backend]

  geoip-updater:
    build: .
    restart: unless-stopped
    environment:
      GEOIP_DATA_DIRECTORY: /geoip
      DBIP_UPDATE_CHECK_INTERVAL_SECONDS: ${DBIP_UPDATE_CHECK_INTERVAL_SECONDS:-86400}
      DBIP_EXPECTED_SHA256: ${DBIP_EXPECTED_SHA256:-}
    command: ["python", "-m", "app.geoip_update"]
    volumes:
      - ./data/geoip:/geoip
    networks: [backend]

  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [telemetry-api, telemetry-admin]
    entrypoint: ["/bin/sh", "/usr/local/bin/gateway-entrypoint.sh"]
    command: []
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:9443:9443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      ADMIN_HOST: ${ADMIN_HOST:-localhost}
      TUNNEL_PEER_CIDR: ${TUNNEL_PEER_CIDR:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./gateway-entrypoint.sh:/usr/local/bin/gateway-entrypoint.sh:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge, backend]

  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-microglow_telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-telemetry}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - postgres-backups:/backups
    networks: [backend]

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-telemetry}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-microglow_telemetry}
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-telemetry}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-microglow_telemetry}
      INSTALLATION_HMAC_SECRET: ${INSTALLATION_HMAC_SECRET:?set INSTALLATION_HMAC_SECRET in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
    networks: [backend]

networks:
  edge:
  backend:
    internal: true
    ipam:
      config:
        - subnet: ${BACKEND_SUBNET:-172.30.0.0/24}

volumes:
  postgres-data:
  postgres-backups:
  caddy-data:
  caddy-config:
